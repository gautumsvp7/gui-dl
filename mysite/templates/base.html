{% load static wagtailcore_tags wagtailuserbar %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CrowdVision{% endblock %}</title>
  <meta name="description" content="Crowd Management Using Computer Vision – CrowdVision">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'icons/icons_bs/font/bootstrap-icons.css' %}">
  <link rel="stylesheet" href="{% static 'css/crowdvision.css' %}">
  {% block extra_css %}{% endblock %}
</head>

<body>
  {% wagtailuserbar %}

  <nav class="cv-navbar">
    <a class="cv-navbar__brand" href="/" style="display:flex; align-items:center; gap:8px;">
      <svg height="26" viewBox="52 52 576 216" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <clipPath id="navEyeClip">
            <path d="M 340,60 C 480,60 590,130 620,160 C 590,190 480,260 340,260 C 200,260 90,190 60,160 C 90,130 200,60 340,60 Z"/>
          </clipPath>
        </defs>
        <g clip-path="url(#navEyeClip)" fill="white">
          <circle cx="268" cy="148" r="28"/>
          <path d="M 251,170 C 210,178 200,210 208,245 L 330,245 C 336,210 326,178 286,170 Z"/>
          <circle cx="412" cy="148" r="28"/>
          <path d="M 394,170 C 354,178 344,210 350,245 L 472,245 C 480,210 470,178 430,170 Z"/>
          <circle cx="340" cy="128" r="34"/>
          <path d="M 318,155 C 268,165 258,202 268,248 L 412,248 C 422,202 412,165 362,155 Z"/>
        </g>
        <path d="M 340,60 C 480,60 590,130 620,160 C 590,190 480,260 340,260 C 200,260 90,190 60,160 C 90,130 200,60 340,60 Z" fill="none" stroke="white" stroke-width="14" stroke-linejoin="round"/>
      </svg>
      CrowdVision
    </a>
    <ul class="cv-navbar__links">
      <li><a href="{% url 'crowd_app:upload' %}" class="{% block nav_upload %}{% endblock %}">Upload</a></li>
      <li><a href="{% url 'crowd_app:results' %}" class="{% block nav_results %}{% endblock %}">Results</a></li>
      <li><a href="/about/" class="{% block nav_about %}{% endblock %}">About</a></li>
    </ul>
  </nav>

  <div class="cv-page">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </div>

  <script src="{% static 'js/jquery.slim.min.js' %}"
          integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
          crossorigin="anonymous"></script>
  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
